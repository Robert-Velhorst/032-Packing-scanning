version: 2
updates:
- package-ecosystem: docker
  directory: /deploy
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: docker-compose
  directory: /deploy
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: gradle
  directory: /android
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  # Gradle 9.6+ removes APIs still used by AGP 8.x. Patch updates on the
  # compatible 9.5 line stay enabled; review the plugin/wrapper migration together.
  ignore:
  - dependency-name: gradle-wrapper
    update-types:
    - version-update:semver-minor
    - version-update:semver-major
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
- package-ecosystem: swift
  directory: /ios/App/CapApp-SPM
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
