name: Packing current stable full application checks
on:
  push:
    branches: [qualify/packing-transitive-refresh-20261029]
permissions:
  contents: read

jobs:
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.2, 26.13.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Use current stable npm
        run: npm install --global npm@12.2.1
      - run: npm ci
      - name: Verify all eight owned Node simulator selection controls
        run: node --test .github/qualification/simulator-selection.controls.mjs
      - run: npm audit --audit-level=moderate
      - run: npm run check:benchmarks
      - run: node scripts/check-xcode.cjs
      - run: npm test
      - run: npm run build

  container:
    name: Container build and runtime tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
      - name: Use current stable npm
        run: npm install --global npm@12.2.1
      - run: docker build --file deploy/Dockerfile --tag packing-scanning:ci .
      - run: node scripts/check-container.mjs packing-scanning:ci
      - name: Start final image and wait for health
        run: |
          docker run --detach --name packing-scanning-ci \
            --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --health-interval 5s --health-retries 12 \
            --publish 127.0.0.1:3001:3001 packing-scanning:ci
          for attempt in {1..45}; do
            status="$(docker inspect --format='{{.State.Health.Status}}' packing-scanning-ci)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs packing-scanning-ci
              exit 1
            fi
            sleep 2
          done
          docker logs packing-scanning-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm --force packing-scanning-ci || true
