name: Android build

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/build-android.sh'
      - 'scripts/verify_android_apks.py'
      - 'scripts/test_android_apks.py'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/build-android.sh'
      - 'scripts/verify_android_apks.py'
      - 'scripts/test_android_apks.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Android tests, lint and assemblies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PACKING_ACCOUNT_ORIGIN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
      - name: Select preinstalled Java 21
        shell: bash
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
      - name: Build bundled app, run native tests and lint
        shell: bash
        run: bash scripts/build-android.sh 2>&1 | tee "$RUNNER_TEMP/packing-android-build.log"
      - name: Verify guest APK signatures, bundled assets and 16 KB alignment
        shell: bash
        env:
          PACKING_HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_android_apks.py'
          mkdir "$RUNNER_TEMP/android-guest-qa"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/android-guest-qa/"
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/android-guest-qa/"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/android-guest-qa/"
          python3 -B scripts/verify_android_apks.py \
            --debug "$RUNNER_TEMP/android-guest-qa/app-debug.apk" \
            --instrumentation "$RUNNER_TEMP/android-guest-qa/app-debug-androidTest.apk" \
            --release "$RUNNER_TEMP/android-guest-qa/app-release-unsigned.apk" \
            --dist dist --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            --source-revision "$(git rev-parse HEAD)" --head-revision "$PACKING_HEAD_REVISION" \
            --output "$RUNNER_TEMP/android-guest-qa/android-artifacts.json"
      - name: Preserve verified guest QA APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-guest-qa-apks
          path: ${{ runner.temp }}/android-guest-qa/
          retention-days: 7
          if-no-files-found: error
      - name: Preserve native build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-build-diagnostics
          path: |
            ${{ runner.temp }}/packing-android-build.log
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: ignore
