name: iOS build

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/build-ios.sh'
      - 'scripts/check-mobile-runtime.mjs'
      - 'mobile-runtime.json'
      - 'scripts/test-ios-voice.swift'
      - 'scripts/test-ios-capture-files.swift'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/build-ios.sh'
      - 'scripts/check-mobile-runtime.mjs'
      - 'mobile-runtime.json'
      - 'scripts/test-ios-voice.swift'
      - 'scripts/test-ios-capture-files.swift'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Unsigned iOS simulator and device builds
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      PACKING_ACCOUNT_ORIGIN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.1
          cache: npm
      - name: Read pinned mobile SDK versions
        id: mobile
        run: node scripts/check-mobile-runtime.mjs profile >> "$GITHUB_OUTPUT"
      - name: Select and verify Apple's final Xcode build
        shell: bash
        env:
          SELECTED_DEVELOPER_DIR: ${{ steps.mobile.outputs.xcode-developer-dir }}
        run: |
          echo "DEVELOPER_DIR=$SELECTED_DEVELOPER_DIR" >> "$GITHUB_ENV"
      - name: Record actual Xcode, Swift and SDK identities
        run: node scripts/check-mobile-runtime.mjs ios > "$RUNNER_TEMP/packing-ios-runtime.json"
      - run: npm ci --ignore-scripts
      - name: Check native capture file boundaries
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ios/App/App/PackingCaptureFiles.swift scripts/test-ios-capture-files.swift -o "$RUNNER_TEMP/capture-file-checks"
          "$RUNNER_TEMP/capture-file-checks"
      - name: Build bundled web assets and native iOS app
        shell: bash
        run: bash scripts/build-ios.sh 2>&1 | tee "$RUNNER_TEMP/packing-ios-build.log"
      - name: Preserve native build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-log
          path: |
            ${{ runner.temp }}/packing-ios-build.log
            ${{ runner.temp }}/packing-ios-runtime.json
          retention-days: 7
          if-no-files-found: ignore
