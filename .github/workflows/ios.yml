name: iOS build

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/build-ios.sh'
      - 'scripts/test-ios-voice.swift'
      - 'scripts/test-ios-capture-files.swift'
      - 'scripts/test-ios-capture-authority.swift'
      - 'scripts/test-ios-encrypted-store.swift'
      - 'scripts/test-ios-point-capture.swift'
      - 'scripts/test-ios-depth-source.swift'
      - 'scripts/test-ios-depth-flow.swift'
      - 'scripts/test-ios-envelope.swift'
      - 'scripts/CheckIosEnvelope.java'
      - 'scripts/check-ios-capture-provider.mjs'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'src/**'
      - 'package*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'scripts/build-ios.sh'
      - 'scripts/test-ios-voice.swift'
      - 'scripts/test-ios-capture-files.swift'
      - 'scripts/test-ios-capture-authority.swift'
      - 'scripts/test-ios-encrypted-store.swift'
      - 'scripts/test-ios-point-capture.swift'
      - 'scripts/test-ios-depth-source.swift'
      - 'scripts/test-ios-depth-flow.swift'
      - 'scripts/test-ios-envelope.swift'
      - 'scripts/CheckIosEnvelope.java'
      - 'scripts/check-ios-capture-provider.mjs'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    name: Unsigned iOS simulator and device builds
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PACKING_ACCOUNT_ORIGIN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check native capture authority and provider compatibility
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ios/App/App/PackingCaptureAuthority.swift scripts/test-ios-capture-authority.swift -o "$RUNNER_TEMP/capture-authority-checks"
          "$RUNNER_TEMP/capture-authority-checks" "$RUNNER_TEMP/capture-provider-fixture.json"
          node scripts/check-ios-capture-provider.mjs "$RUNNER_TEMP/capture-provider-fixture.json"
      - name: Check protected capture persistence
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ios/App/App/PackingCaptureAuthority.swift ios/App/App/PackingScanEnvelope.swift ios/App/App/PackingPointCapture.swift ios/App/App/PackingEncryptedCaptureStore.swift scripts/test-ios-encrypted-store.swift -o "$RUNNER_TEMP/encrypted-store-checks"
          "$RUNNER_TEMP/encrypted-store-checks"
      - name: Check point capture provenance
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ios/App/App/PackingScanEnvelope.swift ios/App/App/PackingPointCapture.swift scripts/test-ios-point-capture.swift -o "$RUNNER_TEMP/point-capture-checks"
          "$RUNNER_TEMP/point-capture-checks"
      - name: Check in-memory depth source and encrypted handoff
        shell: bash
        run: |
          xcrun swiftc -sanitize=thread -g -parse-as-library ios/App/App/PackingCaptureAuthority.swift ios/App/App/PackingScanEnvelope.swift ios/App/App/PackingPointCapture.swift ios/App/App/PackingEncryptedCaptureStore.swift ios/App/App/PackingDepthSource.swift scripts/test-ios-depth-source.swift -o "$RUNNER_TEMP/depth-source-checks"
          TSAN_OPTIONS=halt_on_error=1:exitcode=66 "$RUNNER_TEMP/depth-source-checks"
      - name: Check oriented bounds and Android-native parity
        shell: bash
        run: |
          xcrun swiftc -O -parse-as-library ios/App/App/PackingScanEnvelope.swift ios/App/App/PackingPointCapture.swift scripts/test-ios-envelope.swift -o "$RUNNER_TEMP/envelope-checks"
          "$RUNNER_TEMP/envelope-checks" "$RUNNER_TEMP/envelope-parity.txt"
          mkdir -p "$RUNNER_TEMP/envelope-java"
          javac -d "$RUNNER_TEMP/envelope-java" android/app/src/main/java/com/packingscanning/app/scanning/ScanEnvelope.java android/app/src/main/java/com/packingscanning/app/scanning/DepthCloud.java android/app/src/main/java/com/packingscanning/app/scanning/CaptureGuidance.java scripts/CheckIosEnvelope.java
          java -cp "$RUNNER_TEMP/envelope-java" CheckIosEnvelope "$RUNNER_TEMP/envelope-parity.txt"
      - name: Check depth capture flow and stale callbacks
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ios/App/App/PackingDepthFlow.swift scripts/test-ios-depth-flow.swift -o "$RUNNER_TEMP/depth-flow-checks"
          "$RUNNER_TEMP/depth-flow-checks"
      - name: Check native capture file boundaries
        shell: bash
        run: |
          xcrun swiftc -parse-as-library ios/App/App/PackingCaptureFiles.swift scripts/test-ios-capture-files.swift -o "$RUNNER_TEMP/capture-file-checks"
          "$RUNNER_TEMP/capture-file-checks"
      - name: Build bundled web assets and native iOS app
        shell: bash
        run: bash scripts/build-ios.sh 2>&1 | tee "$RUNNER_TEMP/packing-ios-build.log"
      - name: Preserve native build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/packing-ios-build.log
          retention-days: 7
          if-no-files-found: ignore
