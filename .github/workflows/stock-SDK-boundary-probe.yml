name: Stock Capacitor public queue and Swift 6 actor compiler probe
on:
  push:
    branches: [qualify/packing-stock-SDK-boundary-20261029]
permissions:
  contents: read
jobs:
  compiler-probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Verify official stable Swift signer and compiler selection
        run: python .github/qualification/install-current-stable-swift.py
      - name: Compose verified Apple platform linker without replacing SDK entries
        run: python .github/qualification/compose-current-apple-linker.py
      - name: Compile owned probe against exact published stock SDK
        run: python .github/qualification/check-stock-boundary-probe.py
      - name: Preserve compiler and source integrity evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stock-SDK-boundary-compiler-probe
          path: |
            ${{ runner.temp }}/packing-stock-SDK-boundary/*.json
            ${{ runner.temp }}/packing-stock-SDK-boundary/*.log
            ${{ runner.temp }}/packing-current-stable-swift/*.json
            ${{ runner.temp }}/packing-current-stable-swift/*.log
            ${{ runner.temp }}/packing-current-apple-linker/*.json
            ${{ runner.temp }}/packing-current-apple-linker/*.log
          retention-days: 14
          if-no-files-found: error
