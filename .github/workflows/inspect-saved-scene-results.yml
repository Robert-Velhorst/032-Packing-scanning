name: Inspect retained original scene UI diagnostics
on:
  push:
    branches: [qualify/packing-saved-ui-inspection-20261029]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Read retained synthetic original UI result without running app or tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/qualification/inspect-saved-scene-results.py
      - name: Retain readable diagnostics and exact command outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: saved-scene-ui-inspection
          path: |
            ${{ runner.temp }}/packing-saved-ui-inspection/*.json
            ${{ runner.temp }}/packing-saved-ui-inspection/*.log
            ${{ runner.temp }}/packing-saved-ui-inspection/exports/**
          retention-days: 14
          if-no-files-found: error
