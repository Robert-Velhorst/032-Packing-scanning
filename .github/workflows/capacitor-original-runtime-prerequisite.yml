name: Inspect and provision exact original Capacitor SDK runtime fixture
on:
  push:
    branches: [qualify/packing-capacitor-runtime-prereq-20261029]
permissions:
  contents: read
jobs:
  prerequisite:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - name: Verify exact original runtime without changing SDK case commands
        run: python .github/qualification/check-capacitor-original-runtime.py
      - name: Preserve prerequisite metadata and Apple provisioning diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: original-Capacitor-runtime-prerequisite
          path: |
            ${{ runner.temp }}/capacitor-original-runtime-prerequisite/*.json
            ${{ runner.temp }}/capacitor-original-runtime-prerequisite/*.log
          retention-days: 14
          if-no-files-found: error
